# ScriptForge Annotation Schema v1.0
# AI adaptation annotation with confidence scoring and alternatives.
# Design rationale: every AI decision should be traceable, challengeable,
# and correctable. Annotations capture the "why" behind each adaptation.

schema_version: "1.0"
schema_name: "scriptforge-annotation"

annotation_id: "ann-001"                      # UUID, required
severity: "warning"                            # enum: error | warning | info | suggestion

# Controlled vocabulary for annotation categories.
# adaptation_decision:   general adaptation choice (narrative → visual)
# inner_to_visual:       internal monologue externalized to action/dialogue
# pacing_suggestion:     scene should be split, merged, or reordered
# character_consistency: character behavior deviates from profile
# dialogue_enhancement:  dialogue polished for dramatic effect
# scene_split_merge:     structural suggestion for scene boundaries
# foreshadowing:         setup/payoff relationship suggestion
# format_mismatch:       content doesn't fit standard screenplay format
category: "inner_to_visual"

# What this annotation refers to.
target_reference:
  type: "block"                                # enum: scene | block | character | global
  scene_id: "scene-001"                        # optional, required if type != global
  block_id: "blk-002"                          # optional, required if type == block
  character_id: null                           # optional, required if type == character

title: "内心独白外化建议"                        # string, required
description: |
  原文中林默的内心活动「又是这个号码……我该怎么办」
  被外化为动作块「手指悬停在拨号键上方，最终没有按下」。
  这种处理保留了角色的犹豫，但避免了直接呈现内心独白。

# Quote from the original novel that this annotation references.
source_quote: "又是这个号码……我该怎么办？"

# Alternative adaptation choices with pros/cons.
# Enables "apply alternative" action in the editor.
alternatives:
  - alternative_id: "alt-001"
    text: "保留内心独白，以画外音形式呈现"
    pros: "更忠实于原著情感表达"
    cons: "过于直白，削弱悬疑感"

  - alternative_id: "alt-002"
    text: "将犹豫外化为与女儿照片的互动"
    pros: "增加情感层次，暗示家庭线"
    cons: "需要前文铺垫家庭关系"

# Confidence score (0.0-1.0). Low confidence annotations are flagged
# for mandatory review.
confidence: 0.85                               # float 0.0-1.0, required

# Whether this annotation was auto-applied by the AI (vs. user-created).
auto_applied: true                             # boolean, default false

# Timestamp for audit trail.
created_at: "2026-06-05T10:15:00Z"             # ISO-8601 datetime
